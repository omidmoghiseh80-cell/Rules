/* =====================================================================
   Shared structure. Colours and shapes come from theme tokens.
   ===================================================================== */
:root { --rev-h: 38px; }
html, body { height: 100%; margin: 0; background: #0b0d12; overflow: hidden; }
body { font-family: 'Vazirmatn', sans-serif; }

/* review bar: only for comparing the proposals, not part of the product */
#rev { height: var(--rev-h); display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #13151b; color: #c5cbd6; font-size: 12px; direction: rtl; border-bottom: 1px solid #262a33; overflow-x: auto; white-space: nowrap; scrollbar-width: none; box-sizing: border-box; }
#rev .rv-t { font-weight: 700; color: #fff; }
#rev .rv-g { display: flex; background: #1e2129; border-radius: 8px; padding: 2px; gap: 2px; flex: none; }
#rev button { height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: #a7afbd; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
#rev button:hover { color: #fff; }
#rev button.on { background: #fff; color: #111; font-weight: 700; }
#rev select { height: 28px; border-radius: 7px; border: 1px solid #2c313b; background: #1e2129; color: #fff; font: inherit; padding: 0 6px; flex: 1; min-width: 0; }
#rev .rv-n { margin-inline-start: auto; color: #6b7384; }
#stage { height: calc(100vh - var(--rev-h)); height: calc(100dvh - var(--rev-h)); position: relative; }
#stage.phone { display: flex; align-items: center; justify-content: center; background: radial-gradient(700px 500px at 50% 40%, #1b1f2b, #0b0d12); }
#stage.phone #app { width: 390px; height: min(820px, calc(100% - 30px)); border-radius: 30px; box-shadow: 0 0 0 9px #05060a, 0 0 0 10px #2b2f3a, 0 30px 80px rgba(0, 0, 0, .6); }

#app { height: 100%; position: relative; overflow: hidden; background: var(--bg); color: var(--tx); font-size: var(--fs, 13px); line-height: 1.55; -webkit-font-smoothing: antialiased; text-align: start; }
#app *, #app *::before, #app *::after { box-sizing: border-box; }
:where(#app) button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; margin: 0; }
:where(#app) input, :where(#app) select { font: inherit; color: inherit; margin: 0; }
:where(#app) h4, :where(#app) p { margin: 0; }
#app ::-webkit-scrollbar { width: 8px; height: 8px; }
#app ::-webkit-scrollbar-thumb { background: var(--ln); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
#app ::-webkit-scrollbar-track { background: transparent; }
.shell { height: 100%; }

.n { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.sp { flex: 1; }
.dim { color: var(--tx3); }
.pos { color: var(--up); }
.neg { color: var(--down); }
.fu, .fu2 { color: var(--up); }
.fd, .fd2 { color: var(--down); }
/* dark Robin Sood themes: price stays neutral, the tick only blinks */
.t-pg .fu, .t-rs .fu { color: inherit; animation: cU .45s; }
.t-pg .fu2, .t-rs .fu2 { color: inherit; animation: cU2 .45s; }
.t-pg .fd, .t-rs .fd { color: inherit; animation: cD .45s; }
.t-pg .fd2, .t-rs .fd2 { color: inherit; animation: cD2 .45s; }
@keyframes cU { from { color: var(--up); } }
@keyframes cU2 { from { color: var(--up); } }
@keyframes cD { from { color: var(--down); } }
@keyframes cD2 { from { color: var(--down); } }
.ic { flex: none; display: block; }
.logo { flex: none; display: block; }
.mt8 { margin-top: 8px; }
kbd { font: inherit; font-size: .78em; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--ln); color: var(--tx3); }

/* symbol badge */
.bdg { display: inline-block; flex: none; width: 27px; height: 27px; position: relative; direction: ltr; }
.bdg i { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; border-radius: 50%; color: #fff; font-style: normal; font-weight: 700; font-size: 9.5px; line-height: 18px; text-align: center; box-shadow: 0 0 0 1.5px var(--pan); }
.bdg i:first-child { left: 0; top: 0; right: auto; bottom: auto; z-index: 1; }
.bdg.one i { width: 23px; height: 23px; line-height: 23px; left: 2px; top: 2px; }
.sy { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.sy > i { font-style: normal; color: var(--tx3); font-size: .88em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ty { font-weight: 700; white-space: nowrap; }
.ty.buy { color: var(--buy-tx, var(--buy)); }
.ty.sell { color: var(--sell-tx, var(--sell)); }
.pill { font-size: .82em; padding: 1px 8px; border-radius: 99px; background: var(--sel); color: var(--acc); white-space: nowrap; }
.pct { font-weight: 700; }
.spk { display: block; overflow: visible; flex: none; }
.spk path { fill: none; stroke-width: 1.4; stroke: var(--up); stroke-linejoin: round; }
.spk.dn path { stroke: var(--down); }

/* controls */
.seg { display: inline-flex; background: var(--pan2); border-radius: var(--r-s); padding: 2px; gap: 2px; }
.seg button { padding: 3px 10px; border-radius: calc(var(--r-s) - 2px); color: var(--tx2); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 5px; position: relative; }
.seg button:hover { color: var(--tx); }
.seg button.on { background: var(--seg-on, var(--pan)); color: var(--tx); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.seg.full { display: flex; }
.seg.full button { flex: 1; }
.seg em { font-style: normal; font-size: .8em; min-width: 16px; padding: 0 4px; border-radius: 99px; background: var(--ln); line-height: 1.5; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; height: 34px; color: var(--tx2); border-bottom: 2px solid transparent; white-space: nowrap; flex: none; }
.tab:hover { color: var(--tx); }
.tab.on { color: var(--tx); border-color: var(--acc); }
.tab em { font-style: normal; font-size: 11px; background: var(--pan2); border-radius: 99px; padding: 0 6px; min-width: 18px; text-align: center; line-height: 1.6; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: var(--r-s); font-weight: 700; white-space: nowrap; transition: filter .15s, transform .1s; }
#app .btn.buy { background: var(--buy); color: #fff; }
#app .btn.sell { background: var(--sell); color: #fff; }
#app .btn.pri { background: var(--acc); color: var(--acc-tx, #fff); }
#app .btn.ghost { background: var(--pan2); color: var(--tx); }
#app .btn.danger { background: color-mix(in srgb, var(--down) 15%, transparent); color: var(--down); }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.big { height: 42px; width: 100%; font-size: 1.04em; }
.btn.sm { height: 28px; padding: 0 10px; font-size: .92em; }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--r-s); color: var(--tx2); position: relative; flex: none; }
.ib:hover { background: var(--pan2); color: var(--tx); }
.ib.on { color: var(--acc); }
.ib em, .tbb em, .m-nav em, .rs-nav em, .tiles em { position: absolute; top: 1px; inset-inline-end: 1px; min-width: 15px; height: 15px; border-radius: 99px; background: var(--down); color: #fff; font-style: normal; font-weight: 700; font-size: 10px; line-height: 15px; text-align: center; padding: 0 3px; }
.xb { width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--tx2); flex: none; }
.xb:hover { background: var(--pan2); color: var(--tx); }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld label { font-size: .88em; color: var(--tx2); }
.step { display: flex; align-items: stretch; height: 34px; border: 1px solid var(--ln); border-radius: var(--r-s); background: var(--inp, var(--pan)); overflow: hidden; direction: ltr; }
.step:focus-within { border-color: var(--acc); }
.step button { width: 30px; color: var(--tx2); display: flex; align-items: center; justify-content: center; flex: none; }
.step button:hover { background: var(--pan2); color: var(--tx); }
.step input { flex: 1; min-width: 0; width: 0; border: 0; background: none; text-align: center; outline: 0; font-weight: 700; }
.step input::placeholder, .inp::placeholder, .qbox input::placeholder { color: var(--tx3); font-weight: 400; }
.inp { height: 34px; border: 1px solid var(--ln); border-radius: var(--r-s); background: var(--inp, var(--pan)); padding: 0 10px; outline: 0; width: 100%; }
.inp:focus { border-color: var(--acc); }
.inp.big { height: 46px; font-size: 1.35em; text-align: center; font-weight: 700; }
.chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .9em; color: var(--tx3); }
.chips button { height: 24px; padding: 0 9px; border-radius: 99px; background: var(--pan2); color: var(--tx2); display: inline-flex; align-items: center; gap: 4px; }
.chips button:hover { color: var(--tx); }
.hint { display: flex; justify-content: space-between; gap: 6px; font-size: .82em; color: var(--tx3); min-height: 1.4em; }
.qbox { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--ln); border-radius: var(--r-s); background: var(--inp, var(--pan)); color: var(--tx3); flex: 1; min-width: 0; }
.qbox input { flex: 1; min-width: 0; width: 0; border: 0; background: none; outline: 0; color: var(--tx); }
.qbox:focus-within { border-color: var(--acc); }
.dp { display: flex; gap: 4px; margin-top: 6px; direction: ltr; }
.dp select { flex: 1; min-width: 0; height: 30px; border-radius: var(--r-s); border: 1px solid var(--ln); background: var(--inp, var(--pan)); padding: 0 2px; }
.switch { width: 36px; height: 20px; border-radius: 99px; background: var(--ln); position: relative; transition: .2s; flex: none; }
#app .switch { background: var(--pan3, var(--ln)); }
.switch i { position: absolute; top: 2px; inset-inline-start: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
#app .switch.on { background: var(--acc); }
.switch.on i { inset-inline-start: 18px; }
.ava { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }
#app button.ava { background: var(--brand); color: #fff; }
.ava.sm { width: 30px; height: 30px; background: var(--pan2); color: var(--tx2); }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--tx3); padding: 22px; min-height: 96px; text-align: center; }
.st { display: flex; flex-direction: column; line-height: 1.35; white-space: nowrap; }
.st small { color: var(--tx3); font-size: .82em; }
.kv { display: flex; flex-direction: column; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px dashed var(--ln); }
.kv > div:last-child { border-bottom: 0; }
.kv span { color: var(--tx2); }
.kv.two { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; }
.kv.two > div:nth-last-child(-n+2) { border-bottom: 0; }

/* watch rows (one DOM, grid differs per theme) */
.wr, .wh { display: grid; align-items: center; }
.wr { cursor: pointer; position: relative; }
.wr-name { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.wr-name i { font-style: normal; font-size: .82em; color: var(--tx3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[dir=rtl] .wr .n { text-align: left; }
[dir=ltr] .wr .n { text-align: right; }
.wh span:not(.wr-name) { text-align: end; }
.wr-fav { color: var(--tx3); opacity: 0; display: inline-flex; }
.wr:hover .wr-fav { opacity: 1; }
.wr-fav.on { color: var(--warn); }
.wr-fav.on svg { fill: currentColor; }
.wr-dir, .wr-spk, .wr-ask, .wr-spr, .wr-chg { display: none; }

/* chart */
.ch-wrap { position: relative; flex: 1; min-height: 0; min-width: 0; direction: ltr; }
.ch { position: absolute; inset: 0; overflow: hidden; }
.ch canvas { position: absolute; top: 0; left: 0; display: block; cursor: crosshair; touch-action: none; }
.ch-legend { position: absolute; top: 6px; left: 10px; font-size: 11.5px; color: var(--tx2); pointer-events: none; line-height: 1.55; font-variant-numeric: tabular-nums; max-width: calc(100% - 90px); }
.lg-2 { display: flex; gap: 8px; flex-wrap: wrap; }
.lg-2 span { color: var(--tx3); white-space: nowrap; }
.lg-2 b { font-weight: 400; margin-left: 3px; }
.lg-2.pos b { color: var(--up); }
.lg-2.neg b { color: var(--down); }
.lg-3 { display: flex; gap: 10px; }
.ch-head { display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-height: 52px; flex: none; }
.ch-sym { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: var(--r-s); flex: none; }
.ch-sym:hover { background: var(--pan2); }
.ch-sym > span:not(.bdg) { display: flex; flex-direction: column; line-height: 1.3; text-align: start; }
.ch-sym b { font-size: 1.1em; }
.ch-sym > span:not(.bdg) > i { font-style: normal; font-size: .8em; color: var(--tx3); white-space: nowrap; }
.ch-px { display: flex; align-items: baseline; gap: 8px; }
.ch-px > b { font-size: 1.3em; }
.ch-px .pct { font-size: .9em; }
.ch-head .seg { flex: none; }
.pg-chart, .rs-chart { container-type: inline-size; }
@container (max-width: 780px) {
  .ch-head .tfs button:is(:nth-child(1), :nth-child(4), :nth-child(8)):not(.on) { display: none; }
}
@container (max-width: 640px) {
  .ch-head .types, .ch-sym > span:not(.bdg) > i { display: none; }
}
.seg.tfs button { padding: 3px 7px; font-size: .92em; min-width: 30px; }
.seg.types button { padding: 3px 6px; }
.sess { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-top: 1px solid var(--ln); font-size: .88em; overflow: hidden; flex: none; }
.ss { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; color: var(--tx3); white-space: nowrap; }
.ss i { width: 6px; height: 6px; border-radius: 50%; background: var(--ln); }
.ss.on { color: var(--tx); background: var(--pan2); }
.ss.on i { background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 22%, transparent); }
#app .ev { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; background: color-mix(in srgb, var(--warn) 13%, transparent); color: var(--warn); white-space: nowrap; min-width: 0; }
.ev span { overflow: hidden; text-overflow: ellipsis; }

/* order ticket */
.tk { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.tk-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tk-quote { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; direction: ltr; }
#app .qb { display: flex; flex-direction: column; align-items: center; padding: 6px 4px; border-radius: var(--r-s); border: 1px solid var(--ln); line-height: 1.35; transition: background .15s, border-color .15s; }
.qb small { font-size: .84em; color: var(--tx2); }
.qb > b { font-size: 1.12em; }
#app .qb.sell.on { background: var(--sell); border-color: var(--sell); color: #fff; }
#app .qb.buy.on { background: var(--buy); border-color: var(--buy); color: #fff; }
.qb.on small { color: rgba(255, 255, 255, .85); }
.qs { font-size: .78em; padding: 0 7px; margin: 0 -9px; z-index: 1; background: var(--pan); border: 1px solid var(--ln); border-radius: 99px; color: var(--tx2); line-height: 1.7; }
[data-fmt=big] b { font-size: 1.35em; }
[data-fmt=big] sup { font-size: .78em; vertical-align: top; position: relative; top: .1em; }
.tk-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tk-2.three { grid-template-columns: repeat(3, 1fr); }
.rr { display: flex; align-items: center; gap: 8px; font-size: .86em; color: var(--tx2); }
.rr.off { opacity: .4; }
.rr-bar { flex: 1; display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--pan2); direction: ltr; gap: 2px; }
.rr-bar .r { background: var(--down); flex: 1; }
.rr-bar .w { background: var(--up); flex: 2; }
.rr.off .rr-bar i { background: var(--ln); }
.tk-info { display: flex; justify-content: space-between; font-size: .86em; color: var(--tx2); gap: 10px; }
.tk-info div { display: flex; gap: 6px; }
.tk-info b { color: var(--tx); font-weight: 400; }
.tk-go2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; direction: ltr; }
#ticket.pulse { animation: pulse .7s; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--acc); } 100% { box-shadow: 0 0 0 10px transparent; } }

/* accordion (never open by default) */
#app .acc-h { display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; color: var(--tx2); }
.acc-h span { flex: 1; text-align: start; }
.acc-h > .ic:last-child { transition: transform .2s; }
.acc.open .acc-h > .ic:last-child { transform: rotate(180deg); }
.acc-b { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 10px; }
.acc-b > *, .acc-b .ce, .acc-b .mr { animation: rise .34s both; }
.acc-b > :nth-child(2), .acc-b .ce:nth-child(2), .acc-b .mr:nth-child(2) { animation-delay: .04s; }
.acc-b > :nth-child(3), .acc-b .ce:nth-child(3), .acc-b .mr:nth-child(3) { animation-delay: .08s; }
.acc-b .ce:nth-child(4), .acc-b .mr:nth-child(4) { animation-delay: .12s; }
.acc-b .ce:nth-child(5) { animation-delay: .16s; }
.acc-b .ce:nth-child(6) { animation-delay: .2s; }
.acc-b .ce:nth-child(n+7) { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes sheet { from { transform: translateY(40%); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes drawer { from { transform: translateX(var(--dx, -30%)); opacity: .4; } to { transform: none; opacity: 1; } }

/* tables */
.dock { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.scroll { overflow: auto; min-height: 0; flex: 1; }
.tbl { width: 100%; border-collapse: collapse; white-space: nowrap; }
.tbl th { position: sticky; top: 0; background: var(--pan); color: var(--tx3); font-weight: 400; font-size: .88em; text-align: start; padding: 6px 10px; border-bottom: 1px solid var(--ln); z-index: 1; }
.tbl td { padding: 6px 10px; border-bottom: 1px solid var(--ln2, var(--ln)); text-align: start; }
.tbl th.num { text-align: end; }
[dir=rtl] .tbl td.n { text-align: right; }
[dir=rtl] .tbl td.num { text-align: left; }
[dir=ltr] .tbl td.num { text-align: right; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--hover); }
.tbl tbody tr.cur td { background: var(--sel); }
.tbl .pl { font-weight: 700; }
.tbl tfoot { display: none; }
.act { width: 1%; white-space: nowrap; }
.act button { width: 24px; height: 24px; border-radius: 6px; color: var(--tx3); display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
.act button:hover { background: var(--pan2); color: var(--tx); }
.act .cx:hover { color: var(--down); }
.dock-tools { display: flex; gap: 2px; flex: none; }
.dock-tools button { width: 28px; height: 28px; border-radius: var(--r-s); display: inline-flex; align-items: center; justify-content: center; color: var(--tx2); }
.dock-tools button:hover { background: var(--pan2); color: var(--tx); }

/* history */
.hv { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.hv-top { display: flex; align-items: center; gap: 18px; padding: 8px 12px; border-bottom: 1px solid var(--ln); flex: none; }
.hv-stats { display: flex; gap: 20px; flex: none; }
.kp { display: flex; flex-direction: column; line-height: 1.4; white-space: nowrap; }
.kp small { color: var(--tx3); font-size: .82em; }
.kp b { font-size: 1.08em; }
.hv-curve { position: relative; flex: 1; height: 44px; min-width: 80px; max-width: 360px; direction: ltr; cursor: crosshair; }
.hv-curve svg { width: 100%; height: 100%; display: block; overflow: visible; }
.eq-l { fill: none; stroke: var(--up); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.eq-a { fill: var(--up); opacity: .12; stroke: none; }
svg.dn .eq-l { stroke: var(--down); }
svg.dn .eq-a { fill: var(--down); }
.eq-dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--tx); margin: -4px 0 0 -4px; opacity: 0; pointer-events: none; box-shadow: 0 0 0 3px var(--pan); }
.eq-tip { position: absolute; bottom: calc(100% + 2px); transform: translateX(-50%); background: var(--pop, var(--pan)); color: var(--tx2); border: 1px solid var(--ln); padding: 1px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap; opacity: 0; pointer-events: none; z-index: 3; box-shadow: 0 4px 14px rgba(0, 0, 0, .2); }
.hv-curve:not(:hover) .eq-dot, .hv-curve:not(:hover) .eq-tip { opacity: 0 !important; }
.hv-f { margin-inline-start: auto; flex: none; }

/* calendar */
.cv { display: flex; flex-direction: column; min-height: 0; flex: 1; container-type: inline-size; }
.cv-f { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; flex: none; }
.ce { display: grid; grid-template-columns: 46px 40px 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--ln2, var(--ln)); }
.ce-h { color: var(--tx3); font-size: .86em; border-bottom: 1px solid var(--ln); padding-block: 4px; flex: none; }
.ce.past { opacity: .5; }
.ce.next { background: var(--sel); }
.ce-c { font-weight: 700; font-size: .9em; }
.ce-n { min-width: 0; display: flex; gap: 8px; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ce-cd { color: var(--warn); font-size: .88em; }
.ce-vs { display: grid; grid-template-columns: repeat(3, 58px); gap: 8px; }
.ce-v { text-align: end; white-space: nowrap; }
.ce-v em { display: none; font-style: normal; color: var(--tx3); margin-inline-end: 5px; }
.ce-v b { font-weight: 400; }
.imp { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; direction: ltr; }
.imp i { width: 4px; border-radius: 1px; background: var(--ln); }
.imp i:nth-child(1) { height: 6px; }
.imp i:nth-child(2) { height: 10px; }
.imp i:nth-child(3) { height: 14px; }
.imp.l i:nth-child(1) { background: var(--tx3); }
.imp.m i:nth-child(-n+2) { background: var(--warn); }
.imp.h i { background: var(--down); }
@container (max-width: 520px) {
  .ce { grid-template-columns: 42px 34px 24px minmax(0, 1fr); row-gap: 1px; }
  .ce-n { white-space: normal; }
  .ce-vs { grid-column: 4; display: flex; gap: 12px; font-size: .82em; }
  .ce-vs .ce-v { text-align: start; }
  .ce-v em { display: inline; }
  .ce-h, .cv-day { display: none; }
  .ce-vs:not(:has(.ce-v:not(.dim))) .ce-v:first-child { display: none; }
}

/* messages */
.ml { display: flex; flex-direction: column; }
#app .mr { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--ln2, var(--ln)); text-align: start; width: 100%; }
.mr .dot { width: 7px; height: 7px; border-radius: 50%; }
.mr.unread .dot { background: var(--acc); }
.mr b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mr.unread b { font-weight: 700; }
.mr > span { grid-column: 2 / 4; color: var(--tx3); font-size: .9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mr time { grid-row: 1; grid-column: 3; color: var(--tx3); font-size: .82em; }
#app .mr:hover { background: var(--hover); }
.msgb p { line-height: 2; margin-top: 6px; }

/* transactions */
.tx { display: flex; gap: 20px; padding: 10px 14px; min-height: 0; flex: 1; overflow: auto; }
.tx-c { min-width: 210px; display: flex; flex-direction: column; min-height: 0; }
.tx-c.grow { flex: 1; min-width: 300px; }
.tx-c h4 { font-size: .86em; color: var(--tx3); font-weight: 400; margin-bottom: 4px; }

/* challenge */
.chal { display: flex; flex-direction: column; gap: 10px; }
.chal-h { display: flex; align-items: center; gap: 8px; }
.cb-t { display: flex; justify-content: space-between; font-size: .9em; margin-bottom: 4px; gap: 8px; }
.cb-t span { color: var(--tx2); }
.cb-t b { font-weight: 400; }
.bar { height: 6px; border-radius: 99px; background: var(--pan2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--acc); transition: width .6s; }
[data-lvl=ok] .bar i { background: var(--up); }
[data-lvl=warn] .bar i { background: var(--warn); }
[data-lvl=bad] .bar i { background: var(--down); }
.cb-days { display: flex; align-items: center; gap: 8px; font-size: .9em; color: var(--tx2); }
.dots { display: inline-flex; gap: 4px; flex: 1; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--pan2); border: 1px solid var(--ln); }
.dots i.on { background: var(--acc); border-color: var(--acc); }
.hud { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.hud-days { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; font-size: .86em; color: var(--tx2); }
.hud-days .dots { flex: none; }
.rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ring { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
.ring svg { width: 70px; height: 70px; }
.rg-b { fill: none; stroke: var(--pan3, var(--pan2)); stroke-width: 6; }
.rg-v { fill: none; stroke: var(--acc); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .7s; }
.ring[data-lvl=ok] .rg-v { stroke: var(--up); }
.ring[data-lvl=warn] .rg-v { stroke: var(--warn); }
.ring[data-lvl=bad] .rg-v { stroke: var(--down); }
.ring > b { position: absolute; top: 0; height: 70px; display: flex; align-items: center; font-size: 1.05em; }
.ring > span { font-size: .86em; color: var(--tx2); margin-top: 4px; }
.ring > small { font-size: .72em; color: var(--tx3); white-space: nowrap; }

/* overlays */
#ov { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
.ov { position: absolute; inset: 0; pointer-events: auto; }
.ov.dimmed { background: rgba(0, 0, 0, .46); display: flex; align-items: center; justify-content: center; animation: fade .15s; }
.modal { background: var(--pop, var(--pan)); color: var(--tx); border: 1px solid var(--ln); border-radius: var(--r); box-shadow: 0 24px 70px rgba(0, 0, 0, .38); width: min(420px, calc(100% - 24px)); max-height: calc(100% - 24px); display: flex; flex-direction: column; animation: pop .16s; overflow: hidden; }

#app .m-nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--tx3); font-size: 10.5px; position: relative; min-width: 0; }
#app .m-nav button.on { color: var(--acc); }
.m-nav em { inset-inline-end: calc(50% - 22px); top: 5px; }
.m-tfs { display: flex; align-items: center; gap: 2px; padding: 0 8px; height: 38px; overflow-x: auto; flex: none; scrollbar-width: none; direction: ltr; }
.m-tfs::-webkit-scrollbar { display: none; }
#app .m-tfs button { height: 28px; min-width: 36px; padding: 0 6px; border-radius: 8px; color: var(--tx2); flex: none; display: inline-flex; align-items: center; justify-content: center; }
#app .m-tfs button.on { background: var(--sel); color: var(--acc); font-weight: 700; }
.vsep { width: 1px; height: 18px; background: var(--ln); margin: 0 4px; flex: none; display: block; }
.m-chart { flex: 1; min-height: 0; display: flex; }
.m-trade { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 12px 10px; flex: none; direction: ltr; }
#app .m-trade .qb { height: 50px; justify-content: center; color: #fff; border: 0; border-radius: 12px; }
#app .m-trade .qb.sell { background: var(--sell); }
#app .m-trade .qb.buy { background: var(--buy); }
.m-trade .qb small { color: rgba(255, 255, 255, .86); }
.m-trade .qb > b { font-size: 1.1em; }
.m-sym { display: flex; align-items: center; gap: 8px; min-width: 0; }
.m-sym > span:not(.bdg) { display: flex; flex-direction: column; line-height: 1.25; text-align: start; min-width: 0; }
.m-sym b { font-size: 16px; }
.m-sym > span:not(.bdg) > i { font-style: normal; font-size: 11px; color: var(--tx3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-px { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3; }
.m-px b { font-size: 16px; }
.m-px .pct { font-size: 12px; }
.mob .ch-legend { font-size: 10.5px; top: 4px; left: 8px; max-width: calc(100% - 70px); }
.mob .lg-1, .mob .lg-2 span:last-child { display: none; }
.mob .lg-2 { flex-wrap: nowrap; gap: 6px; }
.mob .tv-qt { display: none; }
.mob #toasts { top: 10px; bottom: auto; inset-inline: 12px; align-items: center; }
.mob .md-b { padding-bottom: 18px; }
.mob .modal.tkm .md-b { padding-bottom: 8px; }
.mob .set .th-grid { grid-template-columns: repeat(5, 1fr); }
.mob .cv, .mob .ml { flex: none; }
.mob .cv .scroll, .mob .ml.scroll { overflow: visible; }

/* quotes: one DOM, four placements */
.mq { display: grid; align-items: center; cursor: pointer; position: relative; }
.mq-name { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; grid-area: name; }
.mq-name b { font-size: 15px; }
.mq-name i { font-style: normal; font-size: 11.5px; color: var(--tx3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mq-bdg { grid-area: bdg; display: flex; }
.mq-spk { grid-area: spk; }
.mq-bid { grid-area: bid; }
.mq-ask { grid-area: ask; }
.mq-pct { grid-area: pct; }
.mq-meta, .mq-chg, .mq-ask, .mq-lo, .mq-hi { display: none; }
[dir=rtl] .mq .n { text-align: left; }
[dir=ltr] .mq .n { text-align: right; }
.mq [data-fmt=big] b, .mq [data-fmt=big] sup { font-size: inherit; vertical-align: baseline; top: 0; }
.mq-bid { font-weight: 700; font-size: 15px; }
.mq-pct { font-size: 12px; }

/* positions */
.mp { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "bdg a pl" "bdg b pl" "x x x"; column-gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--ln2, var(--ln)); cursor: pointer; }
.mp-bdg { grid-area: bdg; display: flex; }
.mp-a { grid-area: a; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.mp-a b { font-size: 15px; }
.mp-a .ty { font-size: 12.5px; }
.mp-b { grid-area: b; color: var(--tx3); font-size: 12.5px; }
[dir=rtl] .mp-b { text-align: right; }
.mp-pl { grid-area: pl; font-size: 15px; font-weight: 700; }
.mp.hist { grid-template-areas: "bdg a pl" "bdg b d"; }
.mp-d { grid-area: d; font-size: 11px; }
.mp-x { grid-area: x; padding-top: 10px; display: flex; flex-direction: column; gap: 8px; animation: rise .22s; }
.mp-t { font-size: 11.5px; }
[dir=rtl] .mp-t { text-align: right; }
.mp-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* summary */
.m-sum.cards { margin: 4px 12px 8px; padding: 14px; border-radius: var(--r); background: var(--pan); border: 1px solid var(--ln); flex: none; }
.hero { display: flex; flex-direction: column; line-height: 1.35; }
.hero small { color: var(--tx3); font-size: 12px; }
.hero b { font-size: 27px; }
.hero span { font-size: 13px; font-weight: 700; }
.m-sum .row { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--ln); }
.m-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 12px 2px; }
.m-kpis .kp { padding: 9px 10px; border-radius: var(--r-s); background: var(--pan2); }

/* more */
.m-prof { display: flex; align-items: center; gap: 10px; padding: 10px 12px 14px; flex: none; }
.m-prof div { display: flex; flex-direction: column; line-height: 1.35; flex: 1; min-width: 0; }
.m-prof small { color: var(--tx3); font-size: 12px; }
.m-prof .ava { width: 44px; height: 44px; font-size: 18px; }
.m-card { margin: 0 12px 6px; padding: 14px; border-radius: var(--r); background: var(--pan); border: 1px solid var(--ln); flex: none; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; flex: none; }
#app .tiles button { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 12px; border-radius: var(--r); background: var(--pan); border: 1px solid var(--ln); font-size: 12.5px; position: relative; }
.tiles i { width: 44px; height: 44px; border-radius: 14px; background: var(--h); color: #fff; display: flex; align-items: center; justify-content: center; }
.tiles em { top: 8px; inset-inline-end: 10px; }
#app .m-out { margin: 6px 12px 18px; height: 46px; border-radius: var(--r-s); color: var(--down); display: flex; gap: 8px; align-items: center; justify-content: center; background: color-mix(in srgb, var(--down) 11%, transparent); flex: none; }
.modal.drawer .m-prof { padding-top: 22px; }

/* ---------- MetaTrader-like phone ---------- */
.t-mt.mob { --bg: #fff; --ln2: #e8e8e8; --acc: #1a73e8; --r: 10px; --r-s: 6px; }

.t-mt.mob .m-nav { background: #fafafa; border-top-color: #d0d0d0; }
.t-mt.mob .mq { grid-template-columns: minmax(0, 1fr) 100px 100px; grid-template-areas: "chg bid ask" "name bid ask" "meta lo hi"; padding: 5px 14px 6px; border-bottom: 1px solid #e8e8e8; column-gap: 6px; }
.t-mt.mob .mq-bdg, .t-mt.mob .mq-spk, .t-mt.mob .mq-pct, .t-mt.mob .mq-name i { display: none; }
.t-mt.mob .mq-meta, .t-mt.mob .mq-chg { display: flex; gap: 8px; font-size: 11px; color: var(--tx3); }
.t-mt.mob .mq-meta { grid-area: meta; align-items: center; }
.t-mt.mob .mq-chg { grid-area: chg; }
[dir=rtl] .t-mt.mob .mq-meta, [dir=rtl] .t-mt.mob .mq-chg { justify-content: flex-end; flex-direction: row-reverse; }

.t-mt.mob .mq-ask, .t-mt.mob .mq-lo, .t-mt.mob .mq-hi { display: block; }
.t-mt.mob .mq-lo { grid-area: lo; }
.t-mt.mob .mq-hi { grid-area: hi; }
.t-mt.mob .mq-lo, .t-mt.mob .mq-hi { font-size: 11px; color: var(--tx3); }
.t-mt.mob .mq-bid, .t-mt.mob .mq-ask { font-size: 15px; font-weight: 400; color: var(--tx); line-height: 1.2; }
.t-mt.mob .mq-bid.fu, .t-mt.mob .mq-ask.fu, .t-mt.mob .mq-bid.fu2, .t-mt.mob .mq-ask.fu2 { color: var(--up); }

.t-mt.mob .mp { padding: 8px 14px; border-bottom-color: #e3e3e3; }

.t-pg.mob .tick { width: 100%; justify-content: flex-start; }

.t-pg.mob .mp, .t-rs.mob .mp { margin: 0 12px 8px; border: 1px solid var(--ln); border-radius: 14px; background: var(--pan); padding: 12px; }
.t-pg.mob .m-trade, .t-rs.mob .m-trade { padding-bottom: 8px; }

.t-rs.mob .m-nav { background: #150a1f; border-top-color: #2c1b3c; height: 62px; }

.t-rs.mob .m-card.hudc { padding: 14px 14px 10px; background: linear-gradient(160deg, rgba(147, 73, 224, .3), rgba(147, 73, 224, .05) 55%), var(--pan); border-color: #3a2550; margin-top: 2px; }

.t-rs.mob .chip { width: 140px; }
.t-rs.mob .mq-pct, .t-rs.mob .m-px .pct { padding: 0 7px; border-radius: 99px; background: color-mix(in srgb, currentColor 14%, transparent); justify-self: end; line-height: 1.6; }
.t-rs.mob .m-head.home { height: 62px; }

function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function gauss(r) {
  let u = 0, v = 0;
  while (u === 0) u = r();
  while (v === 0) v = r();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function initMarket() {
  for (const r of SYMS) {
    const [s, d, p, sp, g, c, name] = r;
    const open = p * (1 + (rnd() - 0.5) * 0.009);
    const m = {
      s, d, p0: p, bid: p, sp, g, c, name, open,
      high: Math.max(open, p) * (1 + rnd() * 0.0016),
      low: Math.min(open, p) * (1 - rnd() * 0.0016),
      dir: 0, hist: [], pt: Math.pow(10, -d), t: Date.now(),
    };
    let v = open; const n = 44;
    for (let i = 0; i < n; i++) { v += (p - v) / (n - i) + gauss(rnd) * p * 0.00055; m.hist.push(v); }
    m.hist[n - 1] = p;
    M[s] = m; SYM_LIST.push(s);
  }
}
const askOf = m => +(m.bid + m.sp * m.pt).toFixed(m.d);

/* ---------- candles ---------- */
const CND = {};
function candles(sym, tf) {
  const key = sym + '|' + tf;
  if (CND[key]) return CND[key];
  const m = M[sym], mins = TFS[tf], n = 340;
  const r = mulberry(hashStr(key));
  const sig = m.p0 * 0.00014 * Math.sqrt(mins);
  const step = mins * 60000;
  const tEnd = Math.floor(Date.now() / step) * step;
  const out = new Array(n);
  let close = m.bid, trend = 0;
  for (let i = n - 1; i >= 0; i--) {
    if (r() < 0.07) trend = (r() - 0.5) * sig * 0.7;
    const o = close - (gauss(r) * sig + trend);
    const hi = Math.max(o, close) + Math.abs(gauss(r)) * sig * 0.42;
    const lo = Math.min(o, close) - Math.abs(gauss(r)) * sig * 0.42;
    out[i] = { t: tEnd - (n - 1 - i) * step, o, h: hi, l: lo, c: close, v: 200 + Math.floor(r() * 900) };
    close = o;
  }
  CND[key] = out;
  return out;
}
function feedCandles(sym) {
  const m = M[sym], now = Date.now();
  for (const key in CND) {
    if (key.indexOf(sym + '|') !== 0) continue;
    const arr = CND[key], step = TFS[key.split('|')[1]] * 60000;
    let last = arr[arr.length - 1];
    if (now - last.t >= step) {
      last = { t: last.t + step, o: last.c, h: last.c, l: last.c, c: last.c, v: 0 };
      arr.push(last); if (arr.length > 600) arr.shift();
    }
    last.c = m.bid; if (m.bid > last.h) last.h = m.bid; if (m.bid < last.l) last.l = m.bid; last.v++;
  }
}

function updateChallenge() {
  const c = challenge();
  for (const el of $$('[data-ch]', APP)) {
    const k = el.dataset.ch, v = c[k], pct = clamp(v.now / v.lim * 100, 0, 100);
    if (k === 'days') {
      const d = $('.dots', el);
      if (d && d.childElementCount !== v.lim) d.innerHTML = Array.from({ length: v.lim }, (_, i) => '<i class="' + (i < v.now ? 'on' : '') + '"></i>').join('');
      $('b', el).textContent = loc(v.now + '/' + v.lim);
      continue;
    }
    const lvl = k === 'target' ? 'ok' : pct > 80 ? 'bad' : pct > 50 ? 'warn' : 'calm';
    el.dataset.lvl = lvl;
    const money = '$' + grp(v.now, 0) + ' / $' + grp(v.lim, 0);
    el.title = money;
    if (el.classList.contains('ring')) {
      const circ = 2 * Math.PI * 26;
      const a = $('.rg-v', el); a.style.strokeDasharray = circ; a.style.strokeDashoffset = circ * (1 - pct / 100);
      $('b', el).textContent = loc(pct.toFixed(0)) + '%';
      $('small', el).textContent = money;
    } else {
      $('.bar i', el).style.width = pct + '%';
      $('b', el).textContent = money;
    }
  }
}

function datePick() {
  const now = new Date();
  let y = now.getFullYear(), mo = now.getMonth() + 1, da = now.getDate();
  if (S.lang === 'fa') {      // Persian UI picks a Jalali date
    dfmt('faP', 'fa-IR-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(now).forEach(x => {
      if (x.type === 'year') y = +x.value; else if (x.type === 'month') mo = +x.value; else if (x.type === 'day') da = +x.value;
    });
  }
  const opt = (a, b, cur, pad) => { let s = ''; for (let i = a; i <= b; i++) s += '<option' + (i === cur ? ' selected' : '') + '>' + loc(pad ? p2(i) : i) + '</option>'; return s; };
  return '<div class="dp"><select aria-label="year">' + opt(y, y + 1, y) + '</select><select aria-label="month">' + opt(1, 12, mo, 1) +
    '</select><select aria-label="day">' + opt(1, 31, da, 1) + '</select><select aria-label="hour">' + opt(0, 23, 23, 1) + '</select><select aria-label="minute">' + opt(0, 59, 59, 1) + '</select></div>';

function updateTicket() {
  const root = $('.tk', APP); if (!root) return;
  const m = M[S.sym], k = S.tk, entry = tkEntry(), pip = pipOf(m);
  const usd = dist => dist * k.lot * m.c * convOf(m, entry);
  const hint = (id, val, good) => {
    const el = $('#' + id, root); if (!el) return 0;
    if (!(val > 0)) { el.innerHTML = ''; return 0; }
    const dist = Math.abs(entry - val);
    el.innerHTML = '<span class="n">' + loc((dist / pip).toFixed(1)) + ' ' + t('pips') + '</span><span class="n ' + (good ? 'pos' : 'neg') + '">' + (good ? '+' : '-') + '$' + grp(usd(dist)) + '</span>';
    return dist;
  };
  const r = hint('tkSlH', k.sl, false), w = hint('tkTpH', k.tp, true);
  const rr = $('#tkRR', root);
  if (rr) {
    rr.classList.toggle('off', !(r > 0 && w > 0));
    if (r > 0 && w > 0) {
      $('.r', rr).style.flex = 1; $('.w', rr).style.flex = (w / r).toFixed(3);
      $('b', rr).textContent = loc('1 : ' + (w / r).toFixed(2));
    }
  }
  const mg = $('#tkMg', root); if (mg) mg.textContent = '$' + grp(marginFor(S.sym, k.lot));
  const pvEl = $('#tkPv', root); if (pvEl) pvEl.textContent = '$' + grp(pipValue(S.sym, k.lot));
  const go = $('#tkGo', root);
  if (go) {
    go.className = 'btn big ' + k.side;
    go.textContent = (k.mode === 'market' ? t(k.side) : typeName(tkType())) + '  ' + lots(k.lot) + '  ' + S.sym;
  }
}

/* ---------- live painting ---------- */
function setPx(el, v, m) { if (el.dataset.fmt === 'big') el.innerHTML = bigPx(v, m.d); else el.textContent = px(v, m.d); }
function flashEl(el, dir) {
  const a = dir > 0 ? 'fu' : 'fd', use = el.classList.contains(a) ? a + '2' : a;
  el.classList.remove('fu', 'fd', 'fu2', 'fd2'); el.classList.add(use);
}
const spreadTxt = m => fam() === 'mt' ? loc(m.sp) : loc((m.sp * m.pt / pipOf(m)).toFixed(1));
function paintSym(s, flash) {
  const m = M[s], a = askOf(m), c = chgOf(m), pc = pctOf(m), up = c >= 0;
  const each = (attr, fn) => { for (const el of APP.querySelectorAll('[' + attr + '="' + s + '"]')) fn(el); };
  each('data-bid', el => { setPx(el, m.bid, m); if (flash && el.hasAttribute('data-flash')) flashEl(el, m.dir); });
  each('data-ask', el => { setPx(el, a, m); if (flash && el.hasAttribute('data-flash')) flashEl(el, m.dir); });
  each('data-spr', el => { el.textContent = spreadTxt(m); });
  const pn = el => { el.classList.toggle('pos', up); el.classList.toggle('neg', !up); };
  each('data-chg', el => { el.textContent = (c > 0 ? '+' : '') + px(c, m.d); pn(el); });
  each('data-chgp', el => { el.textContent = (c > 0 ? '+' : '') + loc(Math.round(c / m.pt)); });
  each('data-pct', el => { el.textContent = (pc > 0 ? '+' : '') + loc(pc.toFixed(2)) + '%'; pn(el); });
  each('data-hi', el => { el.textContent = px(m.high, m.d); });
  each('data-lo', el => { el.textContent = px(m.low, m.d); });
  each('data-time', el => { el.textContent = loc(fmtTime(m.t, true)); });
  each('data-dir', el => { el.classList.toggle('up', m.dir >= 0); el.classList.toggle('dn', m.dir < 0); });
  each('data-rng', el => { el.style.left = clamp((m.bid - m.low) / ((m.high - m.low) || 1) * 100, 0, 100) + '%'; });
  each('data-spk', el => { el.firstElementChild.nextElementSibling.setAttribute('d', sparkPath(m.hist, +el.dataset.w, +el.dataset.h)); el.classList.toggle('up', up); el.classList.toggle('dn', !up); });
}
function paintPositions() {
  for (const el of APP.querySelectorAll('[data-cur]')) {
    const p = POS.find(x => x.id === +el.dataset.cur); if (p) el.textContent = px(curOf(p), M[p.sym].d);
  }
  for (const el of APP.querySelectorAll('[data-pl]')) {
    const p = POS.find(x => x.id === +el.dataset.pl); if (!p) continue;
    const v = plOf(p); el.textContent = signed(v); el.classList.toggle('pos', v >= 0); el.classList.toggle('neg', v < 0);
  }
}
function paintAccount() {
  const a = account();
  for (const el of APP.querySelectorAll('[data-acc]')) {
    const k = el.dataset.acc;
    if (k === 'level') el.textContent = a.margin > 0 ? grp(a.level) + '%' : '—';
    else if (k === 'pl') { el.textContent = signed(a.pl); el.classList.toggle('pos', a.pl >= 0); el.classList.toggle('neg', a.pl < 0); }
    else el.textContent = grp(a[k]);
  }
}
function paintClock() {
  const now = Date.now();
  for (const el of APP.querySelectorAll('[data-clock]')) el.textContent = loc(fmtTime(now, true));
  for (const el of APP.querySelectorAll('[data-cd]')) el.textContent = countdown(+el.dataset.cd);

function chartLines() {

    if (p.sym !== S.sym) continue;
    out.push({ p: p.open, color: dirOf(p) > 0 ? 'buy' : 'sell', dash: !isOpen(p), text: typeName(p.type) + '  ' + lots(p.lot) });

      '<div class="fld"><label>' + t('rrRatio') + '</label><input class="inp n" data-mm="rr" inputmode="decimal" value="' + MMS.rr + '"></div></div>' +
      '<div class="mm-out"><div><small>' + t('riskAmount') + '</small><b class="n neg" id="mmRisk"></b></div><div class="main"><small>' + t('lotSize') + '</small><b class="n" id="mmLot"></b></div><div><small>' + t('potProfit') + '</small><b class="n pos" id="mmWin"></b></div></div>' +
      '<div class="kv"><div><span>' + t('balance') + '</span><b class="n" data-acc="balance"></b></div><div><span>' + t('entry') + '</span><b class="n" id="mmEntry"></b></div><div><span>' + t('sl') + '</span><b class="n" id="mmSl"></b></div><div><span>' + t('tp') + '</span><b class="n" id="mmTp"></b></div></div>' +
      '<button class="btn big pri" data-act="mmapply">' + t('applyTicket') + '</button></div>', 'mmm');
    mmCalc();
  },
  mmside(a) { MMS.side = a; ACT.mm(); },
  mmapply() { const c = mmCalc(); S.tk.side = MMS.side; S.tk.mode = 'market'; S.tk.lot = c.lot; S.tk.sl = c.sl; S.tk.tp = c.tp; closeOv(); if (fam() === 'tv' && !S.mob) { S.side = 'ticket'; render(); } else { openTicket(); rerenderTicket(); } },
  search() {
    modal('', '<div class="cmd"><label class="qbox">' + ic('search', 17) + '<input id="cmdQ" placeholder="' + t('search') + '" autocomplete="off"><kbd>Esc</kbd></label><div class="cmd-l" id="cmdL">' + cmdList('') + '</div></div>', 'cmdm');
    const i = $('#cmdQ', APP); if (i && !S.mob) i.focus();
  },
  pick(a) { closeOv(); S.sym = a; S.tk.sl = S.tk.tp = S.tk.price = 0; if (S.mob && S.page === 'quotes') S.page = 'chart'; render(); },
  drawer() { modal('', mMore(), 'drawer'); },
  mtmenu(a, el) {
    const row = (act, icon, label, arg, on) => '<button data-act="' + act + '"' + (arg ? ' data-arg="' + arg + '"' : '') + '>' + ic(on ? 'check' : icon, 15) + label + '</button>';
    const M_ = {
      file: row('accounts', 'swap', t('switchAccount')) + row('wallet', 'wallet', t('wallet')) + '<hr>' + row('logout', 'logout', t('logout')),
      view: row('togwatch', 'panelL', t('marketWatch'), '', S.watchOpen) + row('togdock', 'panelB', t('toolbox'), '', S.dockOpen) + row('oneclick', 'bolt', t('oneClick'), '', S.oneClick) + row('fs', 'expand', t('fullscreen')) + '<hr>' +
        '<small>' + t('theme') + '</small>' + THEME_ORDER.map(k => row('theme', 'minus', t('th_' + k), k, k === S.theme)).join('') + '<hr><small>' + t('language') + '</small>' + [['fa', 'فارسی'], ['en', 'English'], ['ar', 'العربية']].map(x => row('lang', 'minus', x[1], x[0], x[0] === S.lang)).join(''),
      insert: row('ma', 'fx', t('indicators') + ' (MA 20 / 50)', '', S.ma) + row('demo', 'tline', t('drawTool')),
      charts: ['bars', 'candles', 'line'].map(k => row('ctype', k, t('ct_' + k), k, S.ctype === k)).join('') + '<hr>' + row('zoom', 'zoomin', t('zoomIn'), '1') + row('zoom', 'zoomout', t('zoomOut'), '-1'),
      tools: row('ticket', 'doc', t('newOrder') + '  F9') + row('mm', 'calc', t('moneyMgmt')) + row('dock', 'clock', t('history'), 'hist') + row('settings', 'sliders', t('settings')),
      help: row('demo', 'help', t('help')) + row('demo', 'info', t('about')),
    };
    pop(el, '<div class="menu">' + M_[a] + '</div>', 'mtpop');
  },
  ovclose() { closeOv(); },
};
const WAL = { type: 'dep' };
const MMS = { side: 'buy', risk: 1, pips: 25, rr: 2 };
function mmCalc() {
  const m = M[S.sym], pip = pipOf(m), d = MMS.side === 'buy' ? 1 : -1, entry = d > 0 ? askOf(m) : m.bid;
  const riskAmt = ACC.balance * MMS.risk / 100, perLot = MMS.pips * pip * m.c * convOf(m, entry);
  const lot = perLot > 0 ? clamp(Math.floor(riskAmt / perLot * 100) / 100, 0.01, 50) : 0.01;
  const sl = +(entry - d * MMS.pips * pip).toFixed(m.d), tp = +(entry + d * MMS.pips * MMS.rr * pip).toFixed(m.d);
  const set = (id, v) => { const el = $('#' + id, APP); if (el) el.textContent = v; };
  set('mmRisk', '-$' + grp(lot * perLot)); set('mmLot', lots(lot)); set('mmWin', '+$' + grp(lot * perLot * MMS.rr));
  set('mmEntry', px(entry, m.d)); set('mmSl', px(sl, m.d)); set('mmTp', px(tp, m.d));
  return { lot, sl, tp };
}
function cmdList(q) {
  q = q.trim().toUpperCase();
  const list = SYM_LIST.filter(s => !q || s.indexOf(q) >= 0 || symName(M[s]).toUpperCase().indexOf(q) >= 0);
  if (!list.length) return emptyBox('search', t('noSymbol'));
  return list.map(s => '<button data-act="pick" data-arg="' + s + '">' + badge(s) + '<span><b>' + s + '</b><i>' + esc(symName(M[s])) + '</i></span><span class="sp"></span><span class="n" data-bid="' + s + '"></span><span class="n pct" data-pct="' + s + '"></span></button>').join('');
}
const normDigits = s => String(s).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x06F0).replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x0660);

/* ---------- review bar (not part of the product) ---------- */
const REV_NAMES = ['۱ — شبیه متاتریدر (روشن)', '۲ — شبیه تریدینگ‌ویو (روشن)', '۳ — شبیه تریدینگ‌ویو (تیره)', '۴ — رابین سود، هم‌خانوادهٔ پگاه', '۵ — رابین سود، اختصاصی'];
const REV_SHORT = ['۱ متاتریدر', '۲ تریدینگ‌ویو روشن', '۳ تریدینگ‌ویو تیره', '۴ پگاه', '۵ رابین سود'];
function renderRev() {
  const el = $('#rev'), i = THEME_ORDER.indexOf(S.theme);
  const langs = [['fa', 'فا'], ['en', 'EN'], ['ar', 'ع']];
  if (NARROW.matches) {
    el.innerHTML = '<span class="rv-t">طرح</span><select data-rev="theme">' + THEME_ORDER.map((k, j) => '<option value="' + k + '"' + (j === i ? ' selected' : '') + '>' + REV_SHORT[j] + '</option>').join('') + '</select>' +
      '<div class="rv-g">' + langs.map(x => '<button class="' + (S.lang === x[0] ? 'on' : '') + '" data-act="lang" data-arg="' + x[0] + '" data-rev="1">' + x[1] + '</button>').join('') + '</div>';
    return;
  }
  el.innerHTML = '<span class="rv-t">پیش‌نمایش طرح پیشنهادی</span><div class="rv-g">' + THEME_ORDER.map((k, j) => '<button class="' + (j === i ? 'on' : '') + '" data-act="theme" data-arg="' + k + '" data-rev="1">' + REV_SHORT[j] + '</button>').join('') + '</div>' +
    '<div class="rv-g">' + langs.map(x => '<button class="' + (S.lang === x[0] ? 'on' : '') + '" data-act="lang" data-arg="' + x[0] + '" data-rev="1">' + x[1] + '</button>').join('') + '</div>' +
    '<div class="rv-g"><button class="' + (S.device !== 'phone' ? 'on' : '') + '" data-act="device" data-arg="auto" data-rev="1">' + ic('monitor', 14) + 'لپ‌تاپ</button><button class="' + (S.device === 'phone' ? 'on' : '') + '" data-act="device" data-arg="phone" data-rev="1">' + ic('phone', 14) + 'گوشی</button></div>' +
    '<span class="rv-n">داده‌ها ساختگی است</span>';
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'ovclose' && !(e.target === el || el.dataset.force)) return;
  const fn = ACT[act];
  if (!fn) return;
  const inMenu = !!el.closest('.menu');
  S.revClick = !!el.dataset.rev || inMenu;   // theme/lang picked outside the settings panel: do not reopen it
  if (inMenu) closeOv();
  fn(el.dataset.arg, el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-q]')) { S.q = el.value; refresh('watch'); return; }
  if (el.id === 'cmdQ') { $('#cmdL', APP).innerHTML = cmdList(el.value); paintAll(); return; }
  if (el.matches('[data-money]')) { const v = normDigits(el.value).replace(/[^\d]/g, ''); el.value = v ? grp(+v, 0) : ''; return; }
  if (el.matches('[data-mm]')) { MMS[el.dataset.mm] = Math.max(0, parseFloat(normDigits(el.value)) || 0); mmCalc(); return; }
  if (el.matches('[data-tk]')) {
    const st = stateOf(el.dataset.tk), obj = st[0], key = st[1];
    if (!obj) return;
    if (key === 'comment') { obj.comment = el.value; return; }
    const v = parseFloat(normDigits(el.value));
    obj[key] = key === 'lot' ? clamp(v || 0.01, 0.01, 50) : (v > 0 ? v : 0);
    if (key === 'lot') $$('[data-tk="lot"]', APP).forEach(i => { if (i !== el) i.value = obj.lot.toFixed(2); });
    updateTicket();
  }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-rev="theme"]')) { S.theme = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); ACT.search(); }
  else if (e.key === 'Escape') closeOv();
  else if (e.key === 'F9') { e.preventDefault(); openTicket(); }
  else if (e.key === 'Enter' && e.target.id === 'cmdQ') { const b = $('#cmdL button', APP); if (b) ACT.pick(b.dataset.arg); }
});
function eqHover(e) {
  const tg = e.target.closest ? e.target.closest('.hv-curve') : null;
  if (!tg || EQ_PTS.length < 2) return;
  const pt = e.touches ? e.touches[0] : e, r = tg.getBoundingClientRect();
  const i = clamp(Math.round((pt.clientX - r.left) / r.width * (EQ_PTS.length - 1)), 0, EQ_PTS.length - 1);
  const vs = EQ_PTS.map(p => p.v), lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  const x = i / (EQ_PTS.length - 1) * r.width, y = (46 - 1.5 - (EQ_PTS[i].v - lo) / ((hi - lo) || 1) * 43) / 46 * r.height;
  const dot = $('.eq-dot', tg), tip = $('.eq-tip', tg);
  dot.style.left = x + 'px'; dot.style.top = y + 'px'; dot.style.opacity = 1;
  tip.innerHTML = '<b class="' + (EQ_PTS[i].v >= 0 ? 'pos' : 'neg') + '">' + signed(EQ_PTS[i].v) + '</b> ' + loc(dayMonth(EQ_PTS[i].t));
  tip.style.left = clamp(x, 50, r.width - 50) + 'px'; tip.style.opacity = 1;
}
document.addEventListener('mousemove', eqHover);
document.addEventListener('touchstart', eqHover, { passive: true });
NARROW.addEventListener('change', render);

/* ---------- boot ---------- */
function boot() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (THEMES[h.get('t')]) S.theme = h.get('t');
  if (LANGS.indexOf(h.get('l')) >= 0) S.lang = h.get('l');
  if (h.get('d') === 'phone') S.device = 'phone';
  if (h.get('p')) S.page = h.get('p');
  initMarket(); seedTrading(); seedContent();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (chart) { chart.readStyle(); chart.resize(); } });
  setInterval(() => {
    const changed = simTick();
    changed.forEach(s => paintSym(s, true));
    paintPositions(); paintAccount(); updateChallenge(); updateTicket();
    if (chart && changed.indexOf(S.sym) >= 0) { if (chart.ask != null) chart.ask = askOf(M[S.sym]); chart.request(); if (!chart.cross) setLegend(null); }
    if ($('#tickSvg', APP)) drawTicks();
    if (SIM_EVENTS.length) {
      for (const ev of SIM_EVENTS.splice(0)) toast(ev.p.sym + ' — ' + t(ev.k === 'sl' ? 'hitSl' : ev.k === 'tp' ? 'hitTp' : 'orderFilled'), ev.k === 'sl' ? 'err' : 'ok');
      onPositions();
    }
  }, 650);
  setInterval(paintClock, 1000);
}
boot();

</script>
</body>
